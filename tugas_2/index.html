<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <div class="card-container">
    <img class="img-content" src="./assets/images/illustration-article.svg" alt="Background content" />
    <div class="content-container">
      <p class="content-type-container text-preset-3-bold">Learning</p>
      <p class="text-preset-3">Published 21 Dec 2023</p>
      <p class="text-preset-1 text-title-content">HTML & CSS foundations</p>
      <p class="text-description-content text-preset-2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>
    <div class="avatar-container">
      <img class="avatar-img" src="./assets/images/image-avatar.webp" alt="Avatar content">
      <p class="text-preset-3-bold">Greg Hooper</p>
    </div>
  </div>
</body>

</html>
